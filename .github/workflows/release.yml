name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test ./...

      - name: Cross-compile
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 \
            go build -trimpath -ldflags '-s -w' -o dist/mano-darwin-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags '-s -w' -o dist/mano-windows-amd64.exe .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/mano-darwin-arm64 \
            dist/mano-windows-amd64.exe \
            --title "$TAG" \
            --generate-notes
