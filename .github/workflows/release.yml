name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test ./...

      - name: Cross-compile
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { CGO_ENABLED=0 GOOS="$1" GOARCH="$2" \
            go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/$3" .; }
          build darwin  arm64  orgmaid-darwin-arm64
          build darwin  amd64  orgmaid-darwin-amd64
          build linux   amd64  orgmaid-linux-amd64
          build linux   arm64  orgmaid-linux-arm64
          build windows amd64  orgmaid-windows-amd64.exe
          (cd dist && sha256sum orgmaid-* > checksums.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/orgmaid-darwin-arm64 \
            dist/orgmaid-darwin-amd64 \
            dist/orgmaid-linux-amd64 \
            dist/orgmaid-linux-arm64 \
            dist/orgmaid-windows-amd64.exe \
            dist/checksums.txt \
            --title "$TAG" \
            --generate-notes
